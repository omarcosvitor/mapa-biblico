<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa Bíblico Interativo — Livro de Josué</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<style>
  :root{
    --bg:#0f1115; --panel:#161a21; --panel-2:#1d222b; --border:#2a3140;
    --text:#e7ebf3; --text-dim:#9aa5b8; --accent:#4d8dff; --accent-2:#ff8c00;
    --ok:#3ecf8e; --warn:#e0a94c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",Arial,sans-serif;}
  #app{display:flex;height:100vh;width:100vw;overflow:hidden;}
  #sidebar{width:420px;min-width:320px;max-width:46vw;background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;overflow:hidden;}
  #map{flex:1;height:100%;background:#0b0d11;}
  header{padding:14px 16px 10px;border-bottom:1px solid var(--border);}
  header h1{font-size:15px;margin:0 0 2px;font-weight:600;letter-spacing:.2px;}
  header p{margin:0;font-size:11.5px;color:var(--text-dim);}

  #selectRow{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border);}
  #selectRow select{flex:1;background:var(--panel-2);color:var(--text);border:1px solid var(--border);
    border-radius:6px;padding:7px 8px;font-size:12.5px;}
  #navBtns{display:flex;gap:6px;padding:0 16px 10px;border-bottom:1px solid var(--border);}
  #navBtns button{flex:1;background:var(--panel-2);color:var(--text);border:1px solid var(--border);
    border-radius:6px;padding:6px 4px;font-size:12px;cursor:pointer;}
  #navBtns button:hover{border-color:var(--accent);}
  #navBtns button:disabled{opacity:.35;cursor:default;}

  #timeline{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--border);
    background:var(--panel-2);}
  .tl-item{flex:0 0 auto;min-width:54px;text-align:center;padding:6px 6px;border-radius:6px;cursor:pointer;
    border:1px solid var(--border);font-size:10.5px;color:var(--text-dim);background:var(--panel);}
  .tl-item b{display:block;font-size:12px;color:var(--text);}
  .tl-item.active{border-color:var(--accent);background:rgba(77,141,255,.15);color:var(--text);}

  #content{flex:1;overflow-y:auto;padding:16px;}
  .badge{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:20px;background:rgba(77,141,255,.15);
    color:var(--accent);border:1px solid rgba(77,141,255,.4);margin-bottom:8px;}
  .badge.warn{background:rgba(224,169,76,.15);color:var(--warn);border-color:rgba(224,169,76,.45);}
  h2.card-title{font-size:17px;margin:0 0 4px;}
  .verses{font-size:12px;color:var(--text-dim);margin-bottom:14px;}

  .names{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .name-box{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:9px 10px;}
  .name-box span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);margin-bottom:3px;}
  .name-box strong{font-size:13px;}

  section.block{margin-bottom:14px;}
  section.block h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim);
    margin:0 0 6px;border-bottom:1px solid var(--border);padding-bottom:4px;}
  section.block p{font-size:13px;line-height:1.55;margin:0;color:var(--text);}

  .dist-row{display:flex;gap:10px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;
    padding:10px;font-size:12.5px;}
  .dist-row div{flex:1;}
  .dist-row span{display:block;font-size:10px;color:var(--text-dim);text-transform:uppercase;}

  .hyp-select{display:flex;flex-direction:column;gap:6px;}
  .hyp-option{display:flex;gap:8px;align-items:flex-start;background:var(--panel-2);border:1px solid var(--border);
    border-radius:8px;padding:8px 10px;cursor:pointer;}
  .hyp-option.selected{border-color:var(--accent);}
  .hyp-dot{width:12px;height:12px;border-radius:50%;margin-top:3px;flex:0 0 auto;}
  .hyp-option strong{font-size:12.5px;display:block;}
  .hyp-option p{font-size:11.5px;color:var(--text-dim);margin:2px 0 0;line-height:1.4;}

  footer.note{font-size:10.5px;color:var(--text-dim);padding:10px 16px;border-top:1px solid var(--border);
    background:var(--panel-2);}

  .leaflet-popup-content-wrapper{background:#1d222b;color:#e7ebf3;}
  .leaflet-popup-tip{background:#1d222b;}
  .leaflet-popup-content b{font-size:13px;}
  .leaflet-popup-content small{color:#9aa5b8;}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#2a3140;border-radius:4px;}

  @media (max-width:820px){
    #app{flex-direction:column;}
    #sidebar{width:100%;max-width:100%;height:52vh;}
    #map{height:48vh;}
  }
</style>
</head>

<div id="app">
  <div id="sidebar">
    <header>
      <h1>Mapa Bíblico Interativo</h1>
      <p>Livro de Josué — jornada geográfica capítulo a capítulo</p>
    </header>

    <div id="selectRow">
      <select id="bookSelect"><option value="Josué">Josué</option></select>
      <select id="chapterSelect"></select>
    </div>
    <div id="navBtns">
      <button id="prevBtn">◀ Anterior</button>
      <button id="nextBtn">Próximo ▶</button>
    </div>

    <div id="timeline"></div>

    <div id="content"></div>

    <footer class="note">
      Coordenadas de sítios em disputa são aproximadas e refletem hipóteses arqueológicas concorrentes, não posições confirmadas. Distâncias são estimativas em linha reta (Haversine), não a rota real percorrida.
    </footer>
  </div>
  <div id="map"></div>
</div>

/* ==========================================================================
   ESTADO E UTILITÁRIOS
   ========================================================================== */
let currentIndex = 0;
const selectedHyp = {}; // order -> hypothesis id

function haversineKm(a, b){
  const R = 6371;
  const dLat = (b[0]-a[0]) * Math.PI/180;
  const dLon = (b[1]-a[1]) * Math.PI/180;
  const lat1 = a[0]*Math.PI/180, lat2 = b[0]*Math.PI/180;
  const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function activeCoords(entry){
  if (entry.hypotheses && entry.hypotheses.length){
    const hid = selectedHyp[entry.order] || entry.hypotheses[0].id;
    const h = entry.hypotheses.find(x => x.id === hid) || entry.hypotheses[0];
    return h.coords || entry.coords;
  }
  return entry.coords;
}

/* ==========================================================================
   MAPA (Leaflet)
   ========================================================================== */
const map = L.map('map', { zoomControl: true }).setView([31.9, 35.3], 8);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  subdomains: 'abc', maxZoom: 19
}).addTo(map);

let routeLine = null;
const markers = {}; // order -> marker

function markerIcon(color){
  return L.divIcon({
    className: '',
    html: `<div style="width:16px;height:16px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 0 4px rgba(0,0,0,.6);"></div>`,
    iconSize: [16,16], iconAnchor: [8,8]
  });
}

function buildMap(){
  Object.values(markers).forEach(m => map.removeLayer(m));
  for (const key in markers) delete markers[key];
  if (routeLine) map.removeLayer(routeLine);

  const routeCoords = [];
  biblicalData.forEach(entry => {
    const coords = activeCoords(entry);
    routeCoords.push(coords);
    const color = (entry.hypotheses && entry.hypotheses.length)
      ? (entry.hypotheses.find(h => h.id === (selectedHyp[entry.order] || entry.hypotheses[0].id)) || entry.hypotheses[0]).color
      : '#4d8dff';
    const marker = L.marker(coords, { icon: markerIcon(color) }).addTo(map);
    marker.bindPopup(`<b>Js ${entry.chapter}</b> — ${entry.title}<br><small>${entry.ancientName}</small>`);
    marker.on('click', () => selectByOrder(entry.order));
    markers[entry.order] = marker;
  });

  routeLine = L.polyline(routeCoords, { color: '#9aa5b8', weight: 2, dashArray: '4 6', opacity: .7 }).addTo(map);
}

function flyToEntry(entry){
  const coords = activeCoords(entry);
  map.flyTo(coords, 10, { duration: 1.1 });
  if (markers[entry.order]) markers[entry.order].openPopup();
}

/* ==========================================================================
   PAINEL LATERAL
   ========================================================================== */
const chapterSelect = document.getElementById('chapterSelect');
const timelineEl = document.getElementById('timeline');
const contentEl = document.getElementById('content');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function populateChapterSelect(){
  chapterSelect.innerHTML = biblicalData.map((e,i) =>
    `<option value="${i}">Js ${e.chapter} — ${e.title}</option>`).join('');
}

function populateTimeline(){
  timelineEl.innerHTML = biblicalData.map((e,i) =>
    `<div class="tl-item" data-index="${i}"><b>${e.chapter}</b>${e.ancientName.split(' ')[0].split('(')[0]}</div>`
  ).join('');
  timelineEl.querySelectorAll('.tl-item').forEach(el => {
    el.addEventListener('click', () => selectByIndex(parseInt(el.dataset.index)));
  });
}

function renderCard(index){
  const entry = biblicalData[index];
  const prev = index > 0 ? biblicalData[index-1] : null;
  let distanceBlock = '';
  if (prev){
    const km = haversineKm(activeCoords(prev), activeCoords(entry));
    const hours = km / 4; // ritmo médio de caminhada, terreno variável
    const days = hours / 8; // jornada de ~8h de marcha
    distanceBlock = `
      <div class="dist-row">
        <div><span>Distância (linha reta)</span>${km.toFixed(1)} km</div>
        <div><span>A pé (~4 km/h)</span>${hours < 1 ? Math.round(hours*60)+' min' : hours.toFixed(1)+' h'}</div>
        <div><span>Em jornadas (~8h/dia)</span>${days < 1 ? '< 1 dia' : Math.ceil(days)+' dia(s)'}</div>
      </div>`;
  } else {
    distanceBlock = `<div class="dist-row"><div><span>Relação espacial</span>Ponto de partida da narrativa (sem local anterior)</div></div>`;
  }

  const hasHyp = entry.hypotheses && entry.hypotheses.length > 1;
  let hypBlock = '';
  if (hasHyp){
    const activeId = selectedHyp[entry.order] || entry.hypotheses[0].id;
    hypBlock = `
      <section class="block">
        <h3>Hipóteses de localização</h3>
        <div class="hyp-select">
          ${entry.hypotheses.map(h => `
            <div class="hyp-option ${h.id===activeId?'selected':''}" data-hyp="${h.id}">
              <div class="hyp-dot" style="background:${h.color}"></div>
              <div><strong>${h.label}</strong><p>${h.description}</p></div>
            </div>`).join('')}
        </div>
      </section>`;
  }

  contentEl.innerHTML = `
    <span class="badge ${hasHyp?'warn':''}">${hasHyp ? 'Localização debatida' : 'Localização consensual'}</span>
    <h2 class="card-title">${entry.title}</h2>
    <div class="verses">Josué ${entry.verses}</div>

    <div class="names">
      <div class="name-box"><span>Nome bíblico</span><strong>${entry.ancientName}</strong></div>
      <div class="name-box"><span>Local hoje</span><strong>${entry.modernName}</strong><br><small style="color:var(--text-dim)">${entry.country}</small></div>
    </div>

    <section class="block"><h3>Contexto da época</h3><p>${entry.era}</p></section>
    <section class="block"><h3>Contexto atual</h3><p>${entry.modern}</p></section>
    <section class="block"><h3>Arqueologia</h3><p>${entry.archaeology}</p></section>
    <section class="block"><h3>Relação espacial com etapa anterior</h3>${distanceBlock}</section>
    ${hypBlock}
  `;

  if (hasHyp){
    contentEl.querySelectorAll('.hyp-option').forEach(el => {
      el.addEventListener('click', () => {
        selectedHyp[entry.order] = el.dataset.hyp;
        buildMap();
        renderCard(index);
        flyToEntry(entry);
      });
    });
  }
}

function updateActiveStates(index){
  chapterSelect.value = index;
  timelineEl.querySelectorAll('.tl-item').forEach(el =>
    el.classList.toggle('active', parseInt(el.dataset.index) === index));
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === biblicalData.length - 1;
  const active = timelineEl.querySelector('.tl-item.active');
  if (active) active.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
}

function selectByIndex(index){
  currentIndex = index;
  const entry = biblicalData[index];
  renderCard(index);
  updateActiveStates(index);
  flyToEntry(entry);
}

function selectByOrder(order){
  const idx = biblicalData.findIndex(e => e.order === order);
  if (idx >= 0) selectByIndex(idx);
}

chapterSelect.addEventListener('change', () => selectByIndex(parseInt(chapterSelect.value)));
prevBtn.addEventListener('click', () => { if (currentIndex > 0) selectByIndex(currentIndex - 1); });
nextBtn.addEventListener('click', () => { if (currentIndex < biblicalData.length - 1) selectByIndex(currentIndex + 1); });

/* ==========================================================================
   INICIALIZAÇÃO
   ========================================================================== */
populateChapterSelect();
populateTimeline();
buildMap();
selectByIndex(0);
map.fitBounds(routeLine.getBounds(), { padding: [40,40] });
</script>
